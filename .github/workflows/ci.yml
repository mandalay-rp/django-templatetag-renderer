name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # workflow_dispatch:

  jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        uses: actions/checkout@v4
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

          run: uv sync --all-groups

          run: uv run ruff check .

          run: uv run ruff format --check .

    test:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["3.2", "4.2", "5.0", "5.1"]
      python-version: "3.12"
      django-version: "4.2"
      steps:

        uses: actions/checkout@v4

        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
        python-version: ${{ matrix.python-version }}

        name: Install deps
        run: uv sync --all-groups

        name: Pin Django matrix.django−versionrun:uvpipinstall"django =matrix.django−versionrun:uvpipinstall"django ={{ matrix.django-version }}.0"

        name: Run tests
        run: uv run pytest -q
